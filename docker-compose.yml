services:
  postgres:
    image: postgres:16
    container_name: tandem-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: tandem
      POSTGRES_USER: tandem
      POSTGRES_PASSWORD: tandem
    ports:
      - "5433:5432"
    volumes:
      - tandem_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tandem -d tandem"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  tandem_pgdata:
